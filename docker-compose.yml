services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm_dev_password
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1884:1883" # non-default host port per ADR-004
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquittodata:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: ./worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      # node-pg (the worker's `pg` Pool) needs a postgres:// URL, not the .NET-format
      # "Host=...;Database=..." string. The API (run outside Docker for local dev, see
      # CLAUDE.md) is the only consumer of the .NET format, so no shared-env conflict here
      # unlike docker-compose.staging.yml/production.yml's WORKER_DATABASE_URL split.
      # TASK-360 (Block 9 audit): this was still the broken .NET-format string, so every
      # worker DB query failed with `getaddrinfo ENOTFOUND base` on every job run in local
      # dev — the exact bug TASK-033 (2026-06-11) already diagnosed and fixed for
      # staging/production, just never applied here.
      # KI-027 (2026-07-16): connect as the NOSUPERUSER NOBYPASSRLS app role that owns the
      # tables, NOT the `crm` bootstrap superuser (a superuser bypasses RLS, silently disabling
      # tenant isolation — worker jobs would then read/write across every tenant).
      DATABASE_URL: postgresql://shelfguard_app_dev:307823f594357b97c27a046f33bc5549ad09@postgres:5432/crm
      MQTT_URL: mqtt://mosquitto:1883
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  mosquittodata:
