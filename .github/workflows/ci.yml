name: CI / CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend — build & test
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__DefaultConnection: "Host=localhost;Port=5435;Database=crm;Username=crm;Password=crm_dev_password"
      SHELFGUARD_TEST_DB_CONNECTION: "Host=localhost;Port=5435;Database=crm;Username=crm;Password=crm_dev_password"
      SHELFGUARD_RECOVERY_TEST_DB: "Host=localhost;Port=5435;Database=erm_ci_recovery;Username=crm;Password=crm_dev_password"
      SHELFGUARD_ERP_SCHEMA_TEST_DB: "Host=localhost;Port=5435;Database=erm_schema_test_ci;Username=crm;Password=crm_dev_password"
      SHELFGUARD_POSTING_TEST_DB: "Host=localhost;Port=5435;Database=erm_posting_test_ci;Username=crm;Password=crm_dev_password"
      SHELFGUARD_STOCK_HISTORY_TEST_DB: "Host=localhost;Port=5435;Database=erm_posting_test_ci_history;Username=crm;Password=crm_dev_password"
      Migrations__RunOnStartup: 'false'
    # TASK-553: RlsCrossTenantIntegrationTests and the other Postgres-backed integration
    # tests (grep ShelfGuard.Tests for IAsyncLifetime/NpgsqlConnection) soft-skip whenever
    # no reachable Postgres is configured. Port/user/password/db mirror docker-compose.yml's
    # local dev postgres exactly (5435:5432, crm/crm_dev_password/crm) so every test class's
    # hardcoded DefaultConnectionString resolves here with no code changes and no env
    # overrides — same convention documented in RlsCrossTenantIntegrationTests.cs's class doc.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crm
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm_dev_password
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      # Control-opening tests intentionally use NOWAIT table locks. Background vacuum
      # is a competing writer, so match the dedicated local acceptance fixture.
      # This setting affects only the disposable GitHub service, never production.
      - name: Configure deterministic disposable PostgreSQL maintenance
        env:
          PGPASSWORD: crm_dev_password
        run: |
          psql -h localhost -p 5435 -U crm -d crm -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET autovacuum = 'off'"
          psql -h localhost -p 5435 -U crm -d crm -v ON_ERROR_STOP=1 -c "SELECT pg_reload_conf()"
          for attempt in $(seq 1 25); do
            if [ "$(psql -h localhost -p 5435 -U crm -d crm -Atc 'SHOW autovacuum')" = off ]; then exit 0; fi
            sleep 0.2
          done
          exit 1

      - name: Restore
        run: dotnet restore
        working-directory: backend

      - name: Build
        run: dotnet build -c Release --no-restore
        working-directory: backend

      # dotnet run/Program.cs self-migrates on API startup, but a bare `dotnet test` run
      # against the fresh CI postgres above needs migrations applied explicitly first.
      # Version pinned to match Microsoft.EntityFrameworkCore.Design (8.0.11, see
      # ShelfGuard.Infrastructure.csproj) — an unpinned install can resolve a tool build
      # for a newer .NET than the 8.x SDK/runtime this job installs, which then fails to run.
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 8.0.11

      - name: Apply EF Core migrations to CI Postgres
        run: dotnet ef database update --project ShelfGuard.Infrastructure --startup-project ShelfGuard.Api --configuration Release --no-build
        working-directory: backend
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5435;Database=crm;Username=crm;Password=crm_dev_password"

      - name: Create isolated ERP and recovery databases
        env:
          PGPASSWORD: crm_dev_password
        run: |
          for database in erm_schema_test_ci erm_posting_test_ci erm_posting_test_ci_history; do
            createdb -h localhost -p 5435 -U crm "$database"
          done
          createdb -h localhost -p 5435 -U crm -T crm erm_ci_recovery

      - name: Test all backend cases, including real ERP transactions
        run: dotnet test backend/ShelfGuard.Tests -c Release --no-build --logger 'trx;LogFileName=backend.trx' --results-directory .ci-release/tests

      - name: Publish tested API for Linux
        run: |
          dotnet publish backend/ShelfGuard.Api -c Release -r linux-x64 --self-contained false -o .ci-release/api
          python3 scripts/deploy/receipts-ci-package.py backend

      - name: Upload tested API
        uses: actions/upload-artifact@v4
        with:
          name: receipt-api-${{ github.sha }}
          path: .ci-release/
          include-hidden-files: true
          retention-days: 7

  frontend-ci:
    name: Frontend — typecheck & lint
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://api.agrusystems.pp.ua
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # TASK-377: frontend/package-lock.json was last regenerated with npm >=11
      # (next-intl pulls a nested @swc/core whose peerDependency @swc/helpers>=0.5.17
      # isn't satisfied by the hoisted @swc/helpers@0.5.5 next depends on). npm 11
      # treats that as in-sync; npm 10.x's `ci` sync-check does not and hard-fails
      # with EUSAGE "Missing: @swc/helpers@0.5.23 from lock file" in ~seconds, before
      # tsc/lint ever run. Both Node 20.x and Node 22.x bundle npm 10.x, so bumping
      # node-version alone does not fix this — the runner's npm must be >=11.
      - name: Ensure npm >= 11 (required for lockfile sync check)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Receipt UI and receiving protocol tests
        run: npx vitest run features/receipts/components/ReceiptCategoryPanel.test.tsx features/receipts/components/ReceiptReceiving.test.tsx features/receipts/api/receipt-receiving.test.ts
        working-directory: frontend

      - name: Build production Web
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.agrusystems.pp.ua
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Stage Web artifact
        run: python3 scripts/deploy/receipts-ci-package.py web

      - name: Upload tested Web
        uses: actions/upload-artifact@v4
        with:
          name: receipt-web-${{ github.sha }}
          path: .ci-release/
          include-hidden-files: true
          retention-days: 7

  worker-ci:
    name: Worker — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: worker

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: worker

  mobile-ci:
    name: Mobile — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      # mobile/package-lock.json is regenerated locally with npm >=11; npm 10.x
      # (bundled with both Node 20.x and 22.x) can hard-fail npm ci's sync check
      # on it, same root cause as frontend-ci's npm@11 step above.
      - name: Ensure npm >= 11 (required for lockfile sync check)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci
        working-directory: mobile

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: mobile

  release-package:
    name: Package verified release
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, worker-ci, mobile-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: receipt-api-${{ github.sha }}
          path: .ci-release/
      - uses: actions/download-artifact@v4
        with:
          name: receipt-web-${{ github.sha }}
          path: .ci-release/
      - name: Package immutable API and Web outputs
        run: python3 scripts/deploy/receipts-ci-package.py package --sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: receipt-release-${{ github.sha }}
          path: |
            .ci-release/payload.tar.gz
            .ci-release/payload.sha256
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy verified artifact → production
    runs-on: ubuntu-latest
    needs: release-package
    timeout-minutes: 40
    concurrency:
      group: shelfguard-production
      cancel-in-progress: false
    # Автодеплой вимкнено: скрипти scripts/deploy/receipts-* прив'язані до одного релізу
    # (receipts-20261102) і не придатні для нових релізів. Реліз виконується вручну за runbook
    # до впровадження універсального пайплайну (docs/architecture/ADR-040).
    if: ${{ false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: receipt-release-${{ github.sha }}
          path: .ci-release/
      - name: Verify, rehearse, back up and deploy the tested artifact
        env:
          DEPLOY_SSH_KEY: ${{ secrets.AUTO_DEPLOY_DATABASEMATE }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="/home/administrator/shelfguard-releases/receipts-${GITHUB_SHA:0:12}"
          key_file="$RUNNER_TEMP/receipt-deploy-key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh_opts=(-i "$key_file" -p 10048 -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=.github/production_known_hosts -o ServerAliveInterval=15)
          host=administrator@93.127.143.98
          payload_sha=$(cut -d ' ' -f 1 .ci-release/payload.sha256)
          ssh "${ssh_opts[@]}" "$host" "SG_RELEASE_DIR='$release_dir' python3 -" < scripts/deploy/receipts-production-inventory.py
          scp -i "$key_file" -P 10048 -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=.github/production_known_hosts .ci-release/payload.tar.gz scripts/deploy/receipts-ci-run.py "$host:$release_dir/"
          ssh "${ssh_opts[@]}" "$host" "SG_RELEASE_DIR='$release_dir' python3 '$release_dir/receipts-ci-run.py' --sha '$GITHUB_SHA' --payload-sha '$payload_sha'"
          echo "Production deployment verified for $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
