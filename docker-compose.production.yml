services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shelfguard_api
    restart: unless-stopped
    ports:
      - '5100:5100'
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: ${DATABASE_URL}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-shelfguard}
      Jwt__Audience: ${JWT_AUDIENCE:-shelfguard}
      Cors__Origins: ${Cors__Origins:-http://localhost:3000}
      Claude__ApiKey: ${CLAUDE_API_KEY:-}
      Claude__Model: ${CLAUDE_MODEL:-claude-sonnet-4-6}
      PRRO__PROVIDER: ${PRRO__PROVIDER:-}
      PRRO__BASEURL: ${PRRO__BASEURL:-https://api.checkbox.in.ua/api/v1}
      PRRO__LICENSEKEY: ${PRRO__LICENSEKEY:-}
      PRRO__CASHIER__PINCODE: ${PRRO__CASHIER__PINCODE:-}
      PRRO__CASHIER__LOGIN: ${PRRO__CASHIER__LOGIN:-}
      PRRO__CASHIER__PASSWORD: ${PRRO__CASHIER__PASSWORD:-}
    external_links:
      - shelfguard_postgres

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: shelfguard_web
    restart: unless-stopped
    ports:
      - '3100:3100'
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    container_name: shelfguard_redis
    restart: unless-stopped
    # 6380 on the host: 6379 is taken by another project's Redis. Sharing it
    # causes BullMQ queue-name collisions (workmate-worker steals our jobs).
    ports:
      - '6380:6379'
    volumes:
      - shelfguard_redis_data:/data

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: shelfguard_mosquitto
    restart: unless-stopped
    ports:
      - '1884:1883' # non-default host port per ADR-004
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - shelfguard_mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: shelfguard_worker
    restart: unless-stopped
    depends_on:
      - redis
      - mosquitto
    environment:
      REDIS_URL: ${REDIS_URL:-redis://localhost:6380}
      # node-pg needs a postgres:// URL - DATABASE_URL is the .NET-format string for the API
      DATABASE_URL: ${WORKER_DATABASE_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@shelfguard.app}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:5100}
      WORKER_API_EMAIL: ${WORKER_API_EMAIL:-}
      WORKER_API_PASSWORD: ${WORKER_API_PASSWORD:-}
      # worker is network_mode:host → mosquitto reachable via published host port
      MQTT_URL: ${MQTT_URL:-mqtt://localhost:1884}
    network_mode: host

volumes:
  shelfguard_redis_data:
  shelfguard_mosquitto_data:
