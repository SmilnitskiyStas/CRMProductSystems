# ---------------------------------------------------------------------------
# API topology (resilience stage 3b): ONE backend image, three role instances behind
# an nginx path-routing gateway (infra/gateway/nginx.conf, runbook infra/gateway/README.md).
#   gateway (published :5100) -> api_core | api_consumer | api_provider (internal only)
# BUILD ORDER: only api_core has a `build:` section and tags the image
# `shelfguard-api:latest`; api_consumer/api_provider reuse that tag (no build). deploy.sh
# runs `compose build` first (builds the backend once), then `up -d`, so the tag exists
# before the other two start. Never add `build:` to the other two (3x build time).
# ---------------------------------------------------------------------------
x-api-env: &api-env
  ASPNETCORE_ENVIRONMENT: Production
  ConnectionStrings__DefaultConnection: ${DATABASE_URL}
  Jwt__Secret: ${JWT_SECRET}
  Jwt__Issuer: ${JWT_ISSUER:-shelfguard}
  Jwt__Audience: ${JWT_AUDIENCE:-shelfguard}
  Cors__Origins: ${Cors__Origins:-http://localhost:3000}
  Frontend__BaseUrl: ${Frontend__BaseUrl:-http://localhost:3000}
  Claude__ApiKey: ${CLAUDE_API_KEY:-}
  Claude__Model: ${CLAUDE_MODEL:-claude-sonnet-4-6}
  OpenAI__ApiKey: ${OPENAI_API_KEY:-}
  OpenAI__Model: ${OPENAI_MODEL:-gpt-4o-mini}
  PRRO__PROVIDER: ${PRRO__PROVIDER:-}
  PRRO__BASEURL: ${PRRO__BASEURL:-https://api.checkbox.in.ua/api/v1}
  PRRO__LICENSEKEY: ${PRRO__LICENSEKEY:-}
  PRRO__CASHIER__PINCODE: ${PRRO__CASHIER__PINCODE:-}
  PRRO__CASHIER__LOGIN: ${PRRO__CASHIER__LOGIN:-}
  PRRO__CASHIER__PASSWORD: ${PRRO__CASHIER__PASSWORD:-}
  # SignalR Redis backplane so the consumer hub works across instances.
  SignalR__RedisConnection: redis:6379,abortConnect=false${REDIS_PASSWORD:+,password=${REDIS_PASSWORD}}

services:
  gateway:
    image: nginx:alpine
    container_name: shelfguard_gateway
    restart: unless-stopped
    # NOT loopback-bound: the hosting provider's edge proxy terminates TLS for the
    # no-port URLs (https://api.agrusystems.pp.ua) and forwards straight to host port
    # 5100 from the provider network, bypassing host nginx — a 127.0.0.1 binding
    # breaks the whole site with 502 (incident 2026-07-10). The raw port is not
    # internet-reachable anyway (provider only maps 10054/10048; verified by scan).
    # Host nginx (proxy_pass 127.0.0.1:5100) therefore needs no change.
    ports:
      - '5100:80'
    volumes:
      - ./infra/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    # Gateway must not depend on any API instance to start (names resolve per request).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/gateway-health | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    mem_limit: 128m

  api_core:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: shelfguard-api:latest
    container_name: shelfguard_api_core
    restart: unless-stopped
    volumes:
      - shelfguard_api_uploads:/app/wwwroot/uploads
    # TASK-754: loopback-ONLY port for worker -> api_core internal job calls (/api/internal/*,
    # blocked at the gateway). Deliberately 127.0.0.1 (unlike the gateway's public 5100): the
    # provider edge cannot reach it, only processes on this host (the network_mode:host worker).
    ports:
      - '127.0.0.1:5110:5100'
    environment:
      <<: *api-env
      API_ROLE: core
      # TASK-754: shared secret for /api/internal/* (>= 32 chars; unset = endpoint disabled).
      # Core only - consumer/provider do not host the internal controller.
      InternalJobs__Key: ${INTERNAL_JOB_KEY:-}
      # core owns EF migrations (Migrations__RunOnStartup defaults to true)
    external_links:
      - shelfguard_postgres
    # HEALTHCHECK itself lives in backend/Dockerfile (/health/live on :5100); deploy.sh gates on it.
    # Limits are a safety net so one runaway container can't starve the others on the single
    # host - tune with `docker stats` on the server. Each instance has its own Npgsql pool:
    # postgres max_connections must cover the SUM of the 3 pools (see infra/gateway/README.md).
    mem_limit: 1536m
    cpus: 2.0

  api_consumer:
    image: shelfguard-api:latest
    container_name: shelfguard_api_consumer
    restart: unless-stopped
    # depends_on is only enforced at `up` (so migrations from core finish first on deploy);
    # a later crash/restart of core never blocks or restarts consumer/provider.
    depends_on:
      api_core:
        condition: service_healthy
    volumes:
      - shelfguard_api_uploads:/app/wwwroot/uploads
    environment:
      <<: *api-env
      API_ROLE: consumer
      Migrations__RunOnStartup: 'false'
    external_links:
      - shelfguard_postgres
    mem_limit: 768m
    cpus: 1.0

  api_provider:
    image: shelfguard-api:latest
    container_name: shelfguard_api_provider
    restart: unless-stopped
    depends_on:
      api_core:
        condition: service_healthy
    volumes:
      - shelfguard_api_uploads:/app/wwwroot/uploads
    environment:
      <<: *api-env
      API_ROLE: provider
      Migrations__RunOnStartup: 'false'
    external_links:
      - shelfguard_postgres
    mem_limit: 768m
    cpus: 1.0

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-G-3YWKV939R2}
    container_name: shelfguard_web
    restart: unless-stopped
    # NOT loopback-bound — same reason as the gateway above: the provider edge proxy
    # serves https://agrusystems.pp.ua by forwarding directly to this port.
    ports:
      - '3100:3100'
    depends_on:
      - gateway
    mem_limit: 768m
    cpus: 1.0

  redis:
    image: redis:7-alpine
    container_name: shelfguard_redis
    restart: unless-stopped
    # 6380 on the host: 6379 is taken by another project's Redis. Sharing it
    # causes BullMQ queue-name collisions (workmate-worker steals our jobs).
    # Loopback-only (TASK-332): worker runs with network_mode:host, so it still
    # reaches redis at localhost:6380.
    ports:
      - '127.0.0.1:6380:6379'
    # Optional auth (TASK-332): if REDIS_PASSWORD is set in .env, redis starts with
    # --requirepass; if unset, behavior is unchanged (no auth), so deploys don't
    # break before .env is updated. When setting REDIS_PASSWORD, the worker's
    # REDIS_URL in .env MUST also include it: redis://:PASSWORD@localhost:6380
    command: redis-server ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - shelfguard_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    mem_limit: 384m

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: shelfguard_mosquitto
    restart: unless-stopped
    # Loopback-only (TASK-332): mosquitto runs allow_anonymous — must never be
    # internet-reachable. Worker (network_mode: host) connects via localhost:1884.
    ports:
      - '127.0.0.1:1884:1883' # non-default host port per ADR-004
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - shelfguard_mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: shelfguard_worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1.0
    environment:
      REDIS_URL: ${REDIS_URL:-redis://localhost:6380}
      # node-pg needs a postgres:// URL - DATABASE_URL is the .NET-format string for the API
      DATABASE_URL: ${WORKER_DATABASE_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@shelfguard.app}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:5100}
      WORKER_API_EMAIL: ${WORKER_API_EMAIL:-}
      WORKER_API_PASSWORD: ${WORKER_API_PASSWORD:-}
      # TASK-754: per-tenant production-demand cron -> api_core internal endpoint (loopback port
      # above, NOT the gateway) + the same shared secret as api_core's InternalJobs__Key.
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://localhost:5110}
      INTERNAL_JOB_KEY: ${INTERNAL_JOB_KEY:-}
      # worker is network_mode:host → mosquitto reachable via published host port
      MQTT_URL: ${MQTT_URL:-mqtt://localhost:1884}
    network_mode: host

volumes:
  shelfguard_redis_data:
  shelfguard_mosquitto_data:
  shelfguard_api_uploads:
