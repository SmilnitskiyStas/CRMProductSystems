# ShelfGuard — nginx rate-limit zones (TASK-332)
#
# limit_req_zone is an http-level directive, so it CANNOT live in
# sites-enabled/shelfguard (that file is included inside server-level context
# selection via sites-enabled at http level, but zones must be declared once,
# before the server blocks that reference them).
#
# INSTALL (one-time, on the production server):
#   sudo ln -sf /home/administrator/shelfguard/infra/nginx/shelfguard-ratelimit.conf \
#       /etc/nginx/conf.d/shelfguard-ratelimit.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ubuntu's default /etc/nginx/nginx.conf includes /etc/nginx/conf.d/*.conf at
# http level BEFORE sites-enabled/*, so the zone is defined before it is used.

# Auth brute-force protection: 10 requests/minute per client IP,
# referenced by the /api/auth/(login|refresh|2fa) location in shelfguard.conf.
# 10m zone ≈ 160k distinct IPs.
limit_req_zone $binary_remote_addr zone=shelfguard_auth:10m rate=10r/m;
