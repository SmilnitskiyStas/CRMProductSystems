# ShelfGuard — agrusystems.pp.ua
# Managed by: /home/administrator/shelfguard/infra/nginx/shelfguard.conf
# Symlinked to: /etc/nginx/sites-enabled/shelfguard
#
# NOTE: Provider intercepts ports 80/443 at network level.
# HTTPS is served on port 8443 (externally accessible).
#
# DEPENDS ON: infra/nginx/shelfguard-ratelimit.conf (declares limit_req_zone
# shelfguard_auth at http level). It must be symlinked into /etc/nginx/conf.d/
# BEFORE reloading nginx with this file, otherwise nginx -t fails with
# 'zone "shelfguard_auth" has not been defined':
#   sudo ln -sf /home/administrator/shelfguard/infra/nginx/shelfguard-ratelimit.conf \
#       /etc/nginx/conf.d/shelfguard-ratelimit.conf
#   sudo nginx -t && sudo systemctl reload nginx

# --- HTTPS: Web frontend (port 8443) ---
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name agrusystems.pp.ua www.agrusystems.pp.ua;

    ssl_certificate     /etc/letsencrypt/live/agrusystems.pp.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agrusystems.pp.ua/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/agrusystems.pp.ua/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP intentionally NOT enabled: Next.js injects inline scripts and a strict
    # policy without nonces would break hydration. Suggested starting point
    # (verify in staging before enabling):
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.agrusystems.pp.ua wss://api.agrusystems.pp.ua; frame-ancestors 'self'" always;

    # www → apex redirect
    if ($host = www.agrusystems.pp.ua) {
        return 301 https://agrusystems.pp.ua:8443$request_uri;
    }

    location / {
        proxy_pass         http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}

# --- HTTPS: API (port 8443) ---
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name api.agrusystems.pp.ua;

    ssl_certificate     /etc/letsencrypt/live/agrusystems.pp.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agrusystems.pp.ua/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/agrusystems.pp.ua/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP not applicable to a JSON API; see the web server block above for the
    # suggested (commented) policy for the frontend.

    # Auth brute-force protection (TASK-332). Zone declared in
    # infra/nginx/shelfguard-ratelimit.conf (→ /etc/nginx/conf.d/).
    # Regex location wins over the prefix location / below; proxy_pass is NOT
    # inherited in nginx, so proxy settings are duplicated from location /.
    # /api/auth/refresh is intentionally NOT here: many legit users behind one
    # NAT refresh every 15 min, and refresh tokens (64 random bytes) are not
    # brute-forceable — the API-level limiter (30 req/min/IP) covers it.
    location ~ ^/api/auth/(login|2fa) {
        limit_req zone=shelfguard_auth burst=10 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering    off;
    }

    location / {
        proxy_pass         http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering    off;
    }
}
