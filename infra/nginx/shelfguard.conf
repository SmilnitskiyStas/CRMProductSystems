# ShelfGuard — agrusystems.pp.ua
# Managed by: /home/administrator/shelfguard/infra/nginx/shelfguard.conf
# Symlinked to: /etc/nginx/sites-enabled/shelfguard

# --- HTTP: certbot ACME challenge + redirect to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name agrusystems.pp.ua www.agrusystems.pp.ua api.agrusystems.pp.ua;

    # Let's Encrypt HTTP-01 challenge (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: Web frontend ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name agrusystems.pp.ua www.agrusystems.pp.ua;

    ssl_certificate     /etc/letsencrypt/live/agrusystems.pp.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agrusystems.pp.ua/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/agrusystems.pp.ua/chain.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (1 year)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # www → apex redirect
    if ($host = www.agrusystems.pp.ua) {
        return 301 https://agrusystems.pp.ua$request_uri;
    }

    location / {
        proxy_pass         http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}

# --- HTTPS: API ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.agrusystems.pp.ua;

    ssl_certificate     /etc/letsencrypt/live/agrusystems.pp.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agrusystems.pp.ua/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/agrusystems.pp.ua/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass         http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering    off;
    }
}
