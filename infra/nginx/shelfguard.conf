# ShelfGuard — agrusystems.pp.ua
# Managed by: /home/administrator/shelfguard/infra/nginx/shelfguard.conf
# Symlinked to: /etc/nginx/sites-enabled/shelfguard
#
# NOTE: Provider intercepts ports 80/443 at network level.
# HTTPS is served on port 8443 (externally accessible).

# --- HTTPS: Web frontend (port 8443) ---
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name agrusystems.pp.ua www.agrusystems.pp.ua;

    ssl_certificate     /etc/letsencrypt/live/agrusystems.pp.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agrusystems.pp.ua/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/agrusystems.pp.ua/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # www → apex redirect
    if ($host = www.agrusystems.pp.ua) {
        return 301 https://agrusystems.pp.ua:8443$request_uri;
    }

    location / {
        proxy_pass         http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}

# --- HTTPS: API (port 8443) ---
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name api.agrusystems.pp.ua;

    ssl_certificate     /etc/letsencrypt/live/agrusystems.pp.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agrusystems.pp.ua/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/agrusystems.pp.ua/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass         http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering    off;
    }
}
