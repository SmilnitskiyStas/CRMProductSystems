# ShelfGuard API gateway (resilience stage 3b) - mounted as /etc/nginx/nginx.conf
# in the `gateway` container (production + staging). See infra/gateway/README.md.
#
# Splits ONE image into three role instances so a crash/overload of one role does
# not take the others down:
#   api_core      everything not listed below (auth, stock, POS, AI, uploads, health)
#   api_consumer  consumer mobile app + SignalR hub
#   api_provider  provider/supplier/marketplace/admin
#
# ROUTING: nginx picks `location =` first, then the LONGEST matching prefix.
# Prefixes below are anchored exactly as listed - never loosen them: e.g.
# /api/admin/service-desk (provider) vs /api/service-desk (core), /api/admin/chat
# (provider) vs /api/chat (core), /api/consumer/loyalty (consumer) vs /api/loyalty (core).
#
# STARTUP TRAP: with a static `upstream {}` / literal proxy_pass host nginx resolves
# names at startup and EXITS if one container is not running. We use the Docker DNS
# resolver + a variable in proxy_pass, so names resolve per request and the gateway
# boots with zero upstreams up.
# proxy_pass with a variable and NO URI part forwards the original request URI
# unchanged (path + query, no rewriting) - same as a literal host without a URI.

worker_processes auto;
events { worker_connections 4096; }

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    server_tokens off;
    # Real client IP for rate limiting: first X-Forwarded-For entry, else the peer.
    # NOTE: first entry is client-supplied if the edge only appends; same trust model
    # as the host nginx zone it replicates.
    map $http_x_forwarded_for $client_ip {
        default                    $remote_addr;
        "~^\s*(?<first>[^,\s]+)"   $first;
    }

    # Brute-force protection on credential endpoints (empty key = not limited).
    map $uri $auth_limit_key {
        default                          "";
        ~^/api/auth/(login|2fa)          $client_ip;
        ~^/api/consumer-auth/            $client_ip;
        ~^/api/mobile-auth/login         $client_ip;
    }
    limit_req_zone $auth_limit_key zone=gw_auth:10m rate=10r/m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # Prefer the edge-provided scheme; fall back to ours.
    map $http_x_forwarded_proto $fwd_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    log_format gw '$remote_addr "$request" $status $body_bytes_sent '
                  'up=$upstream_addr rt=$request_time role=$sg_role';
    access_log /dev/stdout gw;
    error_log  /dev/stderr warn;

    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 15m;   # largest API upload limit is 10 MB (import files)

        # Common proxy settings (inherited by every location that does not itself
        # define proxy_set_header - the SignalR block repeats them on purpose).
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_connect_timeout 3s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_buffering       off;

        limit_req zone=gw_auth burst=10 nodelay;
        limit_req_status 429;

        # Gateway-generated failures (upstream down / unresolvable / timeout).
        error_page 502 503 504 =503 @unavailable;

        set $sg_role core;

        location @unavailable {
            default_type application/json;
            add_header X-Served-By gateway always;
            add_header Cache-Control "no-store" always;
            return 503 '{"error":"Service temporarily unavailable.","code":"service_unavailable"}';
        }

        # Liveness of the gateway itself - never touches upstreams.
        location = /gateway-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # ---------------- internal (worker-only, TASK-754) ----------------
        # /api/internal/* is NEVER served through the gateway (the provider edge forwards public
        # traffic to this port). The worker calls api_core directly on a loopback-only host port
        # (INTERNAL_API_BASE_URL) with the X-Internal-Job-Key secret. Case-insensitive regex:
        # ASP.NET routing is case-insensitive, so /API/Internal/ must be blocked too. A regex
        # location beats every prefix location below.
        location ~* ^/api/internal(/|$) {
            default_type application/json;
            return 404 '{"error":"Not found."}';
        }

        # ---------------- consumer ----------------
        location = /api/v1/mobile/config {
            set $sg_role consumer; set $up http://api_consumer:5100;
            add_header X-Served-By consumer always;
            proxy_pass $up;
        }
        location /api/consumer/      { set $sg_role consumer; set $up http://api_consumer:5100; add_header X-Served-By consumer always; proxy_pass $up; }
        location /api/consumer-auth/ { set $sg_role consumer; set $up http://api_consumer:5100; add_header X-Served-By consumer always; proxy_pass $up; }
        location /api/mobile-auth/   { set $sg_role consumer; set $up http://api_consumer:5100; add_header X-Served-By consumer always; proxy_pass $up; }
        location /api/v1/retailers/  { set $sg_role consumer; set $up http://api_consumer:5100; add_header X-Served-By consumer always; proxy_pass $up; }

        # SignalR (WebSocket upgrade, long-lived)
        location /api/hubs/ {
            set $sg_role consumer; set $up http://api_consumer:5100;
            add_header X-Served-By consumer always;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_pass $up;
        }

        # ---------------- provider ----------------
        location /api/provider/              { set $sg_role provider; set $up http://api_provider:5100; add_header X-Served-By provider always; proxy_pass $up; }
        location /api/supplier-cabinet/      { set $sg_role provider; set $up http://api_provider:5100; add_header X-Served-By provider always; proxy_pass $up; }
        location /api/marketplace/           { set $sg_role provider; set $up http://api_provider:5100; add_header X-Served-By provider always; proxy_pass $up; }
        location /api/admin/                 { set $sg_role provider; set $up http://api_provider:5100; add_header X-Served-By provider always; proxy_pass $up; }
        location /api/public/leads           { set $sg_role provider; set $up http://api_provider:5100; add_header X-Served-By provider always; proxy_pass $up; }
        location /api/settings/supplier-profile { set $sg_role provider; set $up http://api_provider:5100; add_header X-Served-By provider always; proxy_pass $up; }

        # ---------------- core (default, incl. /health/*, /uploads/) ----------------
        location = /health/live  { set $up http://api_core:5100; add_header X-Served-By core always; proxy_pass $up; }
        location = /health/ready { set $up http://api_core:5100; add_header X-Served-By core always; proxy_pass $up; }

        location / {
            set $up http://api_core:5100;
            add_header X-Served-By core always;
            proxy_pass $up;
        }
    }
}
